
name: Update Live GitHub Radar

on:
  push:
    branches:
      - main
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-radar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate green GitHub radar
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USERNAME: srikhyathi
        run: |
          python - <<'PY'
          import json
          import os
          import math
          import urllib.request
          from datetime import datetime, timezone, timedelta

          username = os.environ["GH_USERNAME"]
          token = os.environ["GH_TOKEN"]
          end = datetime.now(timezone.utc)
          start = end - timedelta(days=365)

          query = """
          query($login: String!, $from: DateTime!, $to: DateTime!) {
            user(login: $login) {
              contributionsCollection(from: $from, to: $to) {
                totalCommitContributions
                totalIssueContributions
                totalPullRequestContributions
                totalPullRequestReviewContributions
              }
            }
          }
          """

          payload = json.dumps({
              "query": query,
              "variables": {
                  "login": username,
                  "from": start.isoformat(),
                  "to": end.isoformat()
              }
          }).encode("utf-8")

          request = urllib.request.Request(
              "https://api.github.com/graphql",
              data=payload,
              headers={
                  "Authorization": f"Bearer {token}",
                  "Content-Type": "application/json"
              }
          )

          with urllib.request.urlopen(request, timeout=30) as response:
              result = json.load(response)

          if result.get("errors"):
              raise RuntimeError(
                  "GitHub API error: " + json.dumps(result["errors"])
              )

          user = result.get("data", {}).get("user")
          if user is None:
              raise RuntimeError("GitHub user was not found.")

          stats = user["contributionsCollection"]

          # Real contribution counts over the past 365 days.
          # Order: Code Review, Issues, Pull Requests, Commits.
          values = [
              stats["totalPullRequestReviewContributions"],
              stats["totalIssueContributions"],
              stats["totalPullRequestContributions"],
              stats["totalCommitContributions"]
          ]

          labels = [
              "Code Review", "Issues", "Pull Requests", "Commits"
          ]

          # Fixed scale for a more balanced radar chart.
          # Counts above 100 reach the outer grid.
          scale_max = 100
          normalized = [
              min(value / scale_max, 1.0) for value in values
          ]

          width, height = 560, 390
          cx, cy = 280, 195
          radius = 125
          angles = [-90, 0, 90, 180]

          points = []
          for value, angle in zip(normalized, angles):
              radians = math.radians(angle)
              x = cx + radius * value * math.cos(radians)
              y = cy + radius * value * math.sin(radians)
              points.append((x, y))

          polygon = " ".join(
              f"{x:.1f},{y:.1f}" for x, y in points
          )

          green = "#39ff66"
          bright_green = "#00ff44"
          pale_green = "#b7ffca"

          svg = [
              f'<svg xmlns="http://www.w3.org/2000/svg" '
              f'width="{width}" height="{height}" '
              f'viewBox="0 0 {width} {height}">',
              '<rect width="100%" height="100%" fill="#0d1117"/>',

              '<text x="280" y="24" fill="#39ff66" '
              'font-family="Arial,sans-serif" font-size="18" '
              'font-weight="bold" text-anchor="middle">'
              'GitHub Activity Radar</text>',

              f'<g stroke="{green}" stroke-width="1.5" '
              'fill="none" stroke-opacity="0.85">'
          ]

          # Green diamond grid with four levels.
          for level in [0.25, 0.50, 0.75, 1.0]:
              grid_points = []
              for angle in angles:
                  radians = math.radians(angle)
                  x = cx + radius * level * math.cos(radians)
                  y = cy + radius * level * math.sin(radians)
                  grid_points.append(f"{x:.1f},{y:.1f}")

              svg.append(
                  f'<polygon points="{" ".join(grid_points)}"/>'
              )

          # Green axes.
          svg.extend([
              f'<line x1="{cx}" y1="{cy-radius}" '
              f'x2="{cx}" y2="{cy+radius}"/>',
              f'<line x1="{cx-radius}" y1="{cy}" '
              f'x2="{cx+radius}" y2="{cy}"/>',
              '</g>',

              # Bright green filled radar polygon.
              f'<polygon points="{polygon}" '
              f'fill="{bright_green}" fill-opacity="0.40" '
              f'stroke="{green}" stroke-width="3"/>',

              # Green data points.
              f'<g fill="{green}" stroke="{pale_green}" '
              'stroke-width="2">'
          ])

          for x, y in points:
              svg.append(
                  f'<circle cx="{x:.1f}" cy="{y:.1f}" r="4.5"/>'
              )

          svg.extend([
              '</g>',

              # Real count labels in green.
              f'<g fill="{green}" '
              'font-family="Arial,sans-serif" '
              'font-size="13" text-anchor="middle">',

              f'<text x="{cx}" y="49">'
              f'Code Review: {values[0]}</text>',

              f'<text x="{cx+radius+62}" y="{cy+5}">'
              f'Issues: {values[1]}</text>',

              f'<text x="{cx}" y="{cy+radius+28}">'
              f'Pull Requests: {values[2]}</text>',

              f'<text x="{cx-radius-62}" y="{cy+5}">'
              f'Commits: {values[3]}</text>',

              '</g>',

              f'<text x="{cx}" y="365" fill="{green}" '
              'font-family="Arial,sans-serif" font-size="11" '
              'text-anchor="middle">'
              f'Last 365 days | Updated {end.strftime("%Y-%m-%d")}'
              '</text>',

              f'<text x="{cx}" y="382" fill="{green}" '
              'font-family="Arial,sans-serif" font-size="10" '
              'text-anchor="middle">'
              'Radar scale: 0-100 contributions per category'
              '</text>',

              '</svg>'
          ])

          with open(
              "github_radar_chart.svg", "w", encoding="utf-8"
          ) as file:
              file.write("\n".join(svg) + "\n")

          print("Generated green GitHub radar chart.")
          print(dict(zip(labels, values)))
          PY

      - name: Commit updated chart
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add github_radar_chart.svg

          if git diff --cached --quiet; then
            echo "Chart is already up to date."
          else
            git commit -m "Update live GitHub activity radar"
            git push
          fi
