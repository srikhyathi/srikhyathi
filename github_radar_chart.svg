<svg xmlns="http://www.w3.org/2000/svg" width="760" height="560" viewBox="0 0 760 560">
  <title>Dark green GitHub profile radar chart</title>
  <desc>Radar chart for Code Review, Issues, Pull Requests, and Commits. Screenshot-inspired example values: Code Review 4%, Issues 50% illustrative, Pull Requests 85%, Commits 11%.</desc>
  <rect width="100%" height="100%" rx="18" fill="#0d1117"/>
  <text x="32" y="38" fill="#c9d1d9" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="600">Activity Overview</text>
  <g fill="none" stroke="#238636" stroke-opacity="0.55" stroke-width="1.2">
    <polygon points="380.0,230.0 410.0,260.0 380.0,290.0 350.0,260.0" /><polygon points="380.0,200.0 440.0,260.0 380.0,320.0 320.0,260.0" /><polygon points="380.0,170.0 470.0,260.0 380.0,350.0 290.0,260.0" /><polygon points="380.0,140.0 500.0,260.0 380.0,380.0 260.0,260.0" /><polygon points="380.0,110.0 530.0,260.0 380.0,410.0 230.0,260.0" />
    <line x1="380" y1="260" x2="380.0" y2="110.0" /><line x1="380" y1="260" x2="530.0" y2="260.0" /><line x1="380" y1="260" x2="380.0" y2="410.0" /><line x1="380" y1="260" x2="230.0" y2="260.0" />
  </g>
  <polygon points="380.0,254.0 455.0,260.0 380.0,387.5 363.5,260.0" fill="#2ea043" fill-opacity="0.28" stroke="#3fb950" stroke-width="2.5" stroke-linejoin="round"/>
  <circle cx="380.0" cy="254.0" r="4.5" fill="#3fb950" stroke="#0d1117" stroke-width="1.5"/><circle cx="455.0" cy="260.0" r="4.5" fill="#3fb950" stroke="#0d1117" stroke-width="1.5"/><circle cx="380.0" cy="387.5" r="4.5" fill="#3fb950" stroke="#0d1117" stroke-width="1.5"/><circle cx="363.5" cy="260.0" r="4.5" fill="#3fb950" stroke="#0d1117" stroke-width="1.5"/>
  <g fill="#c9d1d9" font-family="Segoe UI, Arial, sans-serif" font-size="15">
    <text x="380" y="62" text-anchor="middle">Code Review</text>
    <text x="568" y="265" text-anchor="start">Issues</text>
    <text x="380" y="500" text-anchor="middle">Pull Requests</text>
    <text x="192" y="265" text-anchor="end">Commits</text>
  </g>
  <g fill="#3fb950" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600">
    <text x="380" y="95" text-anchor="middle">4%</text>
    <text x="380" y="445" text-anchor="middle">85%</text>
    <text x="218" y="282" text-anchor="middle">11%</text>
  </g>
  <text x="32" y="535" fill="#8b949e" font-family="Segoe UI, Arial, sans-serif" font-size="11">Illustrative design • Issues value is a placeholder, not verified GitHub data</text>
</svg>